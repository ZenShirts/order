<!DOCTYPE html>
  <html lang="en-us">
    <head>
      <meta charset="UTF-8">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="stylesheet" href="style.css">
      <link rel="icon" type="image/x-icon" href="favicon.ico">
      <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <header>
      <div>
        <div class="brand"><a href="/home" class="home-link">ZEN<span>SHIRTS</span></a></div>
        <div class="tagline">custom apparel — no printing press required</div>
      </div>
      <div class="tagline" style="text-align:right;">
        <a href="/about">About</a> · <a href="/tshirt_design_tool">Design</a> · <a href="/order">Order and Pay</a>
      </div>
      <div class="brand" style="text-align:center; font-size:20px;">SALE! buy 3, cut total price in half!</div>
    </header>
    <body>
      <h1>Placehoder Text</h1>

      <form>
        <h2>Contact</h1>
        <label for="contact">Email Address:</label><br>
        <input type="text" id="contact" name="contactaddr" placeholder="name@address.com"><br><br>
        <input type="checkbox" id="emailnews" name="emailnews" value="News">
        <label for="emailnews">Email me with news and offers</label>
        <input type="checkbox" id="emailupdate" name="emailupdate" value="Updates">
        <label for="emailupdate">Email me with updates about my order</label>
        <hr>
        <h2>Order info</h2>
        <label for="ordercode">Order Code:</label><br>
        <input type="text" id="ordercode" name="ordercode" required placeholder="ZS1- ..."><br>
        <hr>
        <h2>Shipping</h2>
        <label for="address">Street Address:</label><br>
        <input type="text" id="address" name="address" autocomplete="street-address" required><br>
        <hr>
        <h2>Billing</h2>
        <label for="card-number">Credit Card Number</label>
        <input 
          id="card-number"
          name="card-number"
          type="tel" 
          inputmode="numeric" 
          autocomplete="cc-number" 
          pattern="[0-9 ]+"
          maxlength="19" 
          placeholder="xxxx xxxx xxxx xxxx"
          required
        >
        <br>
        <input type="checkbox" id="baddr-shaddr" name="baddr-shaddr" value="addresses-equal" disabled>
        <label for="baddr-shaddr">My billing address is the same as my shipping address</label><br>
        <input type="text" id="address" name="address" autocomplete="street-address" required><br>
        <input type="submit" id="submit" name="submit">
      </form>
    </body>
  </html>
